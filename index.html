<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Копайлот — прототип</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Сцена не скроллится. Внутри — кадр макета 1440×900, который целиком
       масштабируется под окно, поэтому ассеты всегда точно ложатся на видео. -->
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <video
        id="bg-video"
        class="frame__video"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
        disablepictureinpicture
        disableremoteplayback
      ></video>

      <!-- Сюда JS вставляет ассеты остановок из js/timeline.js -->
      <div class="overlays" id="overlays"></div>

      <!-- Статичный слой поверх всего: шапка -->
      <div class="header" id="header"></div>
    </div>
  </div>

  <!-- Подсказка «скролль» на первом экране -->
  <div class="hint" id="hint">
    <span class="hint__text">Скролль</span>
    <span class="hint__arrow"></span>
  </div>

  <!-- Прогресс по всей длине сцены -->
  <div class="progress" id="progress"><i></i></div>

  <!-- Экран-заглушка, пока видео не залито -->
  <div class="missing" id="missing" hidden>
    <div class="missing__box">
      <b>Видео не найдено</b>
      <p>Положи файл сюда:</p>
      <code id="missing-path">assets/video/main.mp4</code>
      <p class="missing__hint">Скролл и появление ассетов работают и без видео.</p>
    </div>
  </div>

  <!-- Дорожка скролла: её высоту задаёт JS -->
  <div class="track" id="scroll-track"></div>

  <!-- Отладочная панель: клавиша D -->
  <div class="hud" id="hud" hidden>
    <div class="hud__row"><span>video time</span><b id="hud-time">0.00</b></div>
    <div class="hud__row"><span>timecode</span><b id="hud-tc">00_00</b></div>
    <div class="hud__row"><span>duration</span><b id="hud-duration">0.00</b></div>
    <div class="hud__row"><span>scroll</span><b id="hud-scroll">0</b></div>
    <div class="hud__row"><span>progress</span><b id="hud-progress">0%</b></div>
    <div class="hud__row"><span>frame scale</span><b id="hud-scale">1.00</b></div>
    <div class="hud__row"><span>segment</span><b id="hud-segment">—</b></div>
    <div class="hud__row"><span>active stop</span><b id="hud-stop">—</b></div>
    <div class="hud__hr"></div>
    <div class="hud__keys">
      <b>D</b> панель &nbsp; <b>T</b> тайминг &nbsp; <b>G</b> сетка &nbsp; <b>H</b> спрятать ассеты
    </div>
    <div class="hud__marks" id="hud-marks"></div>
  </div>

  <script src="js/timeline.js"></script>
  <script src="js/scroll-video.js"></script>
</body>
</html>
